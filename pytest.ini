
[pytest]
# Session-scoped async fixtures (see conftest.py) require a session-scoped event
# loop. pytest-asyncio >=0.21 deprecated redefining the `event_loop` fixture to
# achieve this; the supported replacement is this config option. Also avoids
# asyncio.get_event_loop(), which raises on Python 3.14.
asyncio_default_fixture_loop_scope = session
markers =
    unit: pure SDK model, config, parsing, and helper tests without server wiring
    integration: tests that exercise FastAPI apps, SDK server wiring, middleware, or async transform execution
    contract: protocol/API contract tests for stable response status, headers, and payload shape
    packaging: built wheel/sdist, source export, generated project, or import-smoke checks
    template: generated starter/template behavior and template regression tests
    security: auth, crypto, secret handling, dependency audit, or vulnerability regression checks
    snapshot: syrupy snapshot tests; pair snapshots with explicit behavior/header/status assertions
    slow: long-running or externally expensive tests
filterwarnings =
    ignore::DeprecationWarning:pytest_nunit.*:
    ignore:.*general_plain_validator_function.*:DeprecationWarning
