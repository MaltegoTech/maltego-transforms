name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-target:
        description: Publish target for manual validation runs
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi

permissions:
  contents: read

jobs:
  build-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.1.4

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (advisory — never fails the build)
        run: poetry run ruff check . --exit-zero

      - name: Test with coverage
        run: poetry run pytest src/tests --cov=src/maltego --cov-report=term-missing

      - name: Build wheel + sdist
        run: poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build-testpypi
    if: github.event_name == 'workflow_dispatch' && inputs.publish-target == 'testpypi'
    permissions:
      id-token: write
    environment:
      name: testpypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - name: Publish release distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      id-token: write
    environment:
      name: pypi
    concurrency:
      group: release-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --pattern 'maltego-transforms-sbom.cdx.json'

      - name: Verify immutable release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isImmutable --jq '.isImmutable' | grep -qx true; then
            echo "Refusing to publish assets from a mutable release."
            exit 1
          fi

          shopt -s nullglob
          wheels=(release-assets/*.whl)
          sdists=(release-assets/*.tar.gz)
          sbom=release-assets/maltego-transforms-sbom.cdx.json
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ] || [ ! -f "$sbom" ]; then
            echo "Expected exactly one wheel, one sdist, and one SBOM."
            exit 1
          fi

          mkdir -p dist
          cp "${wheels[0]}" "${sdists[0]}" dist/

      - name: Verify release build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in release-assets/*.whl release-assets/*.tar.gz release-assets/maltego-transforms-sbom.cdx.json; do
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow MaltegoTech/maltego-transforms/.github/workflows/prepare-release.yml \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA"
          done

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
