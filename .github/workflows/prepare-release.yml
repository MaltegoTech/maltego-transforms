name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing draft release tag to prepare, for example v1.0.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Verify release is an existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true; then
            echo "Release $RELEASE_TAG must exist as a draft before preparation."
            exit 1
          fi

      - name: Verify preparation runs from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release preparation must run from the main branch."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}
          persist-credentials: false

      - name: Verify tag points to the workflow commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Release tag must point to the current main commit."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==2.1.4

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(poetry version --short)"
          if [ "$NORMALIZED_TAG" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (advisory — never fails the build)
        run: poetry run ruff check . --exit-zero

      - name: Test with coverage
        run: poetry run pytest src/tests --cov=src/maltego --cov-report=term-missing

      - name: Build wheel + sdist
        run: poetry build

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          poetry run python resources/generate_sbom.py --output dist/sbom/maltego-transforms-sbom.cdx.json

      - name: Attest release build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom/maltego-transforms-sbom.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sbom
          path: dist/sbom/maltego-transforms-sbom.cdx.json
          retention-days: 7

  attach-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: dist-sbom
          path: dist/sbom/

      - name: Verify release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true; then
            echo "Release $RELEASE_TAG must still be a draft before assets are attached."
            exit 1
          fi

      - name: Attach wheel + sdist + SBOM to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/sbom/maltego-transforms-sbom.cdx.json --clobber
