version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    versioning-strategy: lockfile-only
    groups:
      pip-dev:
        dependency-type: development
        patterns:
          - "*"
      pip-production:
        dependency-type: production
        patterns:
          - "*"
    commit-message:
      prefix: chore
