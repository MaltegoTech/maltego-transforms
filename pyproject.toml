[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry]
name = "maltego-transforms"
version = "1.0.1"
description = "Maltego Transform development framework with async support and standalone Transform server"
authors = [
    "Maltego Technologies GmbH",
]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MaltegoTech/maltego-transforms"
repository = "https://github.com/MaltegoTech/maltego-transforms"
documentation = "https://docs.maltego.com/en/support/solutions/articles/15000062349-maltego-transforms-sdk-overview"
keywords = ["maltego", "osint", "transforms", "sdk", "graph"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "maltego", from = "src" },
]
# Belt-and-suspenders exclusion of credentials/key material from built artifacts.
# These globs are evaluated relative to the source tree that poetry packages up; they
# complement the existing built-artifact assertion tests in src/tests/packaging/.
exclude = [
    "**/*.key",
    "**/*.pem",
    "**/*.crt",
    "**/.env",
    "**/.env.*",
]

[tool.poetry.scripts]
maltego-transforms = 'maltego._cli:execute_from_command_line'


[tool.poetry.dependencies]
python = ">=3.10,<3.15"
uvicorn = "^0.35.0"
fastapi = "^0.137.1"
aiofiles = "^24.1.0"
cachetools = "^6.1.0"
typing-extensions = "^4.9"
httpx = "^0.27.2"
python-dateutil = "^2.8.2"
Pillow = "^12.3.0"
pycryptodome = "^3.20"
markdown = "^3.4.0"
frozenlist = "^1.4.1"
pydantic = "^2.13"
fastapi-restful = "^0.5"
typing-inspect = "^0.9"
pydantic-settings = "^2.1"
authlib = ">=1.6.11,<1.7.0"
packaging = "^25.0"
cryptography = ">=48.0.1,<51.0.0"
joserfc = "^1.6.8"
signxml = "^4.4.0"
idna = "^3.15"
starlette = ">=1.3.1,<2.0.0"
nh3 = "^0.3.6"
opentelemetry-api = {version = ">=1.26,<2.0", optional = true}
opentelemetry-sdk = {version = ">=1.26,<2.0", optional = true}
opentelemetry-instrumentation-fastapi = {version = ">=0.47b0,<1.0", optional = true}
opentelemetry-propagator-b3 = {version = ">=1.26,<2.0", optional = true}
opentelemetry-exporter-otlp-proto-grpc = {version = ">=1.26,<2.0", optional = true}

[tool.poetry.extras]
tracing = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-propagator-b3",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0"
pytest-cov = "^4"
xmltodict = "^0"
autopep8 = "^2"
pylint= "^3"
mypy = "^1"
toml = "^0"
types-aiofiles = "^22"
types-cachetools = "^5"
types-certifi = "^2021"
types-chardet = "^5"
types-python-dateutil = "^2"
types-requests = "^2"
types-markdown = "^3"
types-xmltodict = "^0"
types-Pillow = "^9"
types-toml = "^0"
syrupy = "^4"
cyclonedx-bom = "^7.3.0"
detect-secrets = "^1.5.0"
pip-audit = "^2.10.1"
ruff = "^0.14.11"
pre-commit = "^4.6.0"
commitizen = "<4.16.4"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
update_changelog_on_bump = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F403",
    "F405",
]
